name: Android CI Build

# Workflow ini TIDAK memerlukan repository secret apa pun.
# - gradle-wrapper.jar di-generate otomatis kalau belum ada di repo.
# - Build "release" ditandatangani pakai debug keystore bawaan AGP
#   (auto-generated di runner), jadi tetap bisa dibuild tanpa keystore/secret.
#   Ini cukup untuk testing/distribusi internal, BUKAN untuk rilis Play Store.
#
# Semua output konsol Gradle (termasuk error compile) disimpan sebagai
# file .log dan ikut di-upload sebagai artifact "gradle-console-logs",
# supaya bisa didownload & dianalisis walau job gagal.

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (+ dependency cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-read-only: false

      - name: Generate Gradle Wrapper (jika belum ada)
        run: |
          mkdir -p ci-logs
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::notice::gradle-wrapper.jar tidak ditemukan, generate otomatis..."
            gradle wrapper --gradle-version 8.9 --distribution-type bin 2>&1 | tee ci-logs/00-wrapper-generate.log
          else
            echo "::notice::gradle-wrapper.jar sudah ada, skip generate."
          fi
          chmod +x ./gradlew

      - name: Validate Gradle Wrapper checksum
        uses: gradle/actions/wrapper-validation@v4

      - name: Show environment info
        run: |
          {
            echo "### 🧩 Environment"
            echo '```'
            java -version
            ./gradlew --version
            echo '```'
          } | tee ci-logs/01-environment.log >> "$GITHUB_STEP_SUMMARY"

      - name: Lint (debug)
        run: |
          set -o pipefail
          ./gradlew lintDebug --stacktrace --info 2>&1 | tee ci-logs/02-lint.log
        continue-on-error: true

      - name: Unit tests (debug)
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --info 2>&1 | tee ci-logs/03-unit-test.log
        continue-on-error: true

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee ci-logs/04-assemble-debug.log

      - name: Build release APK (signed dengan debug key, tanpa secret)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --info 2>&1 | tee ci-logs/05-assemble-release.log

      - name: Extract error summary from logs
        if: always()
        run: |
          {
            echo "### ❗ Cuplikan error (jika ada)"
            echo '```'
            grep -inE "^e: |error:|FAILURE|what went wrong|Exception|Unresolved reference" ci-logs/*.log 2>/dev/null | tail -80 || echo "Tidak ditemukan baris error eksplisit."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gradle console logs (SELALU, walau gagal)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-console-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload full Gradle build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: umk-checker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: umk-checker-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 📱 UMK Checker — Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Info | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Event | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          if ls app/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
            echo "| Debug APK | ✅ berhasil dibuat |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Debug APK | ❌ gagal |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            echo "| Release APK | ✅ berhasil dibuat |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Release APK | ❌ gagal |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📄 Log konsol lengkap ada di artifact **gradle-console-logs**." >> "$GITHUB_STEP_SUMMARY"
